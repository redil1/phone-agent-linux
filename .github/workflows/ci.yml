name: production-validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos-validation:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.6"
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked --all-extras --dev
      - name: Verify frozen WhatsApp boundary
        run: uv run python tools/verify_frozen_whatsapp.py
      - name: Lint
        run: uv run ruff check ai_bridge integrations/business_suite/phoneagent_frappe mac_client qualification release tests tools
      - name: Validate business-suite scripts and schemas
        run: |
          bash -n tools/install_full_business_suite_macos.sh tools/business_suite_status.sh \
            tools/backup_business_suite.sh tools/restore_business_suite.sh \
            tools/stop_full_business_suite.sh integrations/business_suite/scripts/init-site.sh
          find integrations/business_suite/phoneagent_frappe -name '*.json' -print0 | \
            xargs -0 -n1 python -m json.tool >/dev/null
      - name: Test
        run: uv run pytest -q
      - name: Validate Studio JavaScript
        run: |
          python -c 'from pathlib import Path; p=Path("ai_bridge/web_static/index.html").read_text(); Path("/tmp/phoneagent-studio.js").write_text(p.rsplit("<script>",1)[1].split("</script>",1)[0])'
          node --check /tmp/phoneagent-studio.js
      - name: Build Python distributions
        run: uv build
      - name: Export and validate CycloneDX SBOM
        run: |
          uv export --preview-features sbom-export --locked --all-extras --format cyclonedx1.5 --output-file dist/sbom.json
          python -m json.tool dist/sbom.json >/dev/null
      - name: Audit locked dependencies
        run: |
          uv export --locked --all-extras --no-emit-project --format requirements.txt --output-file dist/requirements.lock.txt
          uvx --from pip-audit==2.10.1 pip-audit --requirement dist/requirements.lock.txt --no-deps --disable-pip --strict --progress-spinner off
      - name: Type-check and build native desktop app
        run: |
          swiftc -typecheck desktop_app/PhoneAgentDesktop.swift -framework Cocoa -framework WebKit
          ./desktop_app/build_app.sh
          codesign --verify --deep --strict build/PhoneAgent.app
      - uses: actions/upload-artifact@v4
        with:
          name: phone-agent-validation-artifacts
          path: |
            dist/
            build/PhoneAgent.app
