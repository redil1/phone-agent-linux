services:
  crawl4ai:
    image: unclecode/crawl4ai:0.9.2@sha256:bd36741e7bdd35ddc1a05d9183e1d6d8cefb61dd640d944a25d026b76e917690
    container_name: phoneagent-crawl4ai
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${CRAWL4AI_PORT:-11235}:11235"
    environment:
      CRAWL4AI_PORT: "11235"
      REDIS_TASK_TTL: "900"
      CRAWL4AI_HOOKS_ENABLED: "false"
      CRAWL4AI_ALLOW_INSECURE_TLS: "false"
    volumes:
      - ${CRAWL4AI_CONFIG_FILE:?CRAWL4AI_CONFIG_FILE is required}:/app/config.yml:ro
    secrets:
      - source: crawl4ai_api_token
        target: api_token
        mode: 0400
    user: appuser
    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/redis:uid=999,gid=999,mode=0700
      - /var/lib/crawl4ai/outputs:uid=999,gid=999,mode=0700
      - /home/appuser/.crawl4ai:uid=999,gid=999,mode=0700
      - /home/appuser/.cache/url_seeder:uid=999,gid=999,mode=0700
      - /home/appuser/.gunicorn:uid=999,gid=999,mode=0700
    shm_size: 1gb
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    ulimits:
      nproc:
        soft: 512
        hard: 512
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 3g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:11235/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

secrets:
  crawl4ai_api_token:
    file: ${CRAWL4AI_TOKEN_FILE:?CRAWL4AI_TOKEN_FILE is required}
