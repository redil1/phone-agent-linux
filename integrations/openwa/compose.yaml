services:
  openwa:
    image: ghcr.io/rmyndharis/openwa:0.23.3@sha256:c00b5b589446ce7dd6177f1b871789284bcfbe3612189ba109465025eb0ad4ec
    container_name: phoneagent-openwa
    restart: unless-stopped
    stop_grace_period: 45s
    ports:
      - "127.0.0.1:${OPENWA_PORT:-2785}:2785"
    environment:
      NODE_ENV: production
      NODE_ID: phoneagent-openwa
      AUTO_START_SESSIONS: "true"
      PORT: "2785"
      LOG_LEVEL: info
      SERVE_DASHBOARD: "true"
      ENABLE_SWAGGER: "false"
      ENGINE_TYPE: baileys
      SESSION_DATA_PATH: /app/data/sessions
      API_MASTER_KEY: ${OPENWA_MASTER_KEY:?OPENWA_MASTER_KEY is required}
      API_KEY_PEPPER: ${OPENWA_API_KEY_PEPPER:?OPENWA_API_KEY_PEPPER is required}
      MCP_ENABLED: "true"
      MCP_READONLY: "false"
      MCP_RATE_LIMIT_MAX: "60"
      MCP_RATE_LIMIT_WINDOW_MS: "60000"
      MCP_IP_RATE_LIMIT_MAX: "120"
      MCP_IP_RATE_LIMIT_WINDOW_MS: "60000"
      SIMULATE_TYPING: "true"
      SIMULATE_TYPING_MAX_MS: "5000"
      SEND_PACING_ENABLED: "true"
      SEND_PACING_WARMUP_SCHEDULE: 20,40,80,160,320,640,1000
      SEND_PACING_COLD_DAILY_CAP: 5,10,20,40,60,80,100
      SEND_PACING_BREAKER_THRESHOLD: "5"
      SEND_PACING_BREAKER_COOLDOWN_MS: "900000"
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/data/media
      CORS_ORIGINS: http://127.0.0.1:2785,http://localhost:2785
    volumes:
      - phoneagent-openwa-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    pids_limit: 512
    mem_limit: 1536m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:2785/api/health/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

volumes:
  phoneagent-openwa-data:
    name: phoneagent-openwa-data
